<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLASH TRACK — ระบบจัดการพัสดุ (Admin)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Anuphan:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="stripes"></div>
<nav class="nav admin-bar">
  <a href="index.html" class="brand"><span class="bolt">⚡</span>FLASH<b>TRACK</b> · Admin</a>
  <a href="index.html" class="nav-link">← หน้าเช็คพัสดุ</a>
</nav>

<!-- ========== LOGIN ========== -->
<div id="loginView" class="login-wrap hidden">
  <div class="card login-card">
    <div class="res-head"><div><div class="label">เข้าสู่ระบบ</div><div class="tno">พนักงาน</div></div><span style="font-size:1.6rem">🔐</span></div>
    <div class="card-pad">
      <form id="loginForm">
        <div class="field">
          <label>อีเมล</label>
          <input id="email" type="email" required placeholder="admin@example.com">
        </div>
        <div class="field">
          <label>รหัสผ่าน</label>
          <input id="password" type="password" required placeholder="••••••••">
        </div>
        <button class="btn" style="width:100%" id="loginBtn" type="submit">เข้าสู่ระบบ</button>
      </form>
      <p class="hint" style="margin-top:14px">สร้างบัญชี admin ได้ใน Supabase Dashboard → Authentication → Users</p>
    </div>
  </div>
</div>

<!-- ========== DASHBOARD ========== -->
<main id="dashView" class="wrap hidden" style="max-width:1080px">
  <div class="toolbar">
    <h2>📦 จัดการพัสดุ</h2>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="hint" id="userTag" style="margin:0"></span>
      <button class="btn ghost sm" id="logoutBtn">ออกจากระบบ</button>
    </div>
  </div>

  <div class="stat-row" id="stats"></div>

  <div class="toolbar">
    <div class="search-mini">
      <input id="filterInput" placeholder="ค้นหาเลขพัสดุ / ผู้รับ">
    </div>
    <button class="btn alt" id="newBtn">+ เพิ่มพัสดุ</button>
  </div>

  <div class="table-scroll">
    <table>
      <thead><tr>
        <th>เลขพัสดุ</th><th>ผู้รับ</th><th>สถานะ</th><th>อัปเดต</th><th style="text-align:right">จัดการ</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="emptyRow" class="state hidden"><span class="ico">📭</span>ยังไม่มีพัสดุ — กด "เพิ่มพัสดุ" เพื่อเริ่มต้น</div>
</main>

<!-- ========== MODAL: parcel ========== -->
<div id="modal" class="modal-bg hidden">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">เพิ่มพัสดุ</h3>
      <button class="x" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <form id="parcelForm">
        <input type="hidden" id="pId">
        <div class="field">
          <label>เลขพัสดุ *</label>
          <input id="pTno" required placeholder="FL1234567890" class="mono" style="font-family:'JetBrains Mono'">
        </div>
        <div class="row2">
          <div class="field"><label>ชื่อผู้ส่ง</label><input id="pSenderName"></div>
          <div class="field"><label>เบอร์ผู้ส่ง</label><input id="pSenderPhone"></div>
        </div>
        <div class="row2">
          <div class="field"><label>ชื่อผู้รับ</label><input id="pReceiverName"></div>
          <div class="field"><label>เบอร์ผู้รับ</label><input id="pReceiverPhone"></div>
        </div>
        <div class="field"><label>ที่อยู่ผู้รับ</label><textarea id="pReceiverAddress"></textarea></div>
        <div class="row2">
          <div class="field"><label>น้ำหนัก (กก.)</label><input id="pWeight" type="number" step="0.01"></div>
          <div class="field"><label>เก็บเงินปลายทาง (฿)</label><input id="pCod" type="number" step="0.01"></div>
        </div>
        <div class="field"><label>สถานะปัจจุบัน</label><select id="pStatus"></select></div>
        <div class="field"><label>หมายเหตุ</label><textarea id="pNote"></textarea></div>
        <button class="btn" type="submit" id="saveBtn" style="width:100%">บันทึก</button>
      </form>

      <!-- events editor (เฉพาะตอนแก้ไข) -->
      <div id="eventsBlock" class="hidden" style="margin-top:24px;border-top:2px solid var(--line);padding-top:18px">
        <h3 style="font-size:1.05rem;margin:0 0 12px">🛰️ ประวัติการขนส่ง</h3>
        <ul class="ev-list" id="evList"></ul>
        <div class="card" style="box-shadow:none;border-width:2px">
          <div class="card-pad" style="padding:14px">
            <div class="row2">
              <div class="field" style="margin:0"><label>สถานะ</label><select id="evStatus"></select></div>
              <div class="field" style="margin:0"><label>สถานที่</label><input id="evLocation" placeholder="เช่น ศูนย์คัดแยกพิษณุโลก"></div>
            </div>
            <div class="field" style="margin:10px 0"><label>รายละเอียด</label><input id="evDesc" placeholder="ข้อความที่แสดงในไทม์ไลน์"></div>
            <button class="btn alt sm" id="addEvBtn" type="button">+ เพิ่มสถานะ</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/statuses.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
