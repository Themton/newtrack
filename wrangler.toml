name = "newtrack-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2026-06-02"
preview_urls = false

[[kv_namespaces]]
binding = "JT_TRACKING_INBOX"
id = "f8e8114ff2544335ac731b4d7f7b0d38"

[observability]
enabled = true

# auto-sync สถานะ Flash ทุก 2 นาที (เช็ค 500 รายการ/รอบ เรียงอัปเดตเก่าสุดก่อน → หมุนครบ)
[triggers]
crons = ["*/2 * * * *"]
